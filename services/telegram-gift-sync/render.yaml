services:
  - type: web
    name: telegram-gift-sync
    runtime: node
    plan: free
    rootDir: services/telegram-gift-sync
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GIFT_SYNC_INTERVAL_MS
        value: "300000"
      - key: SUPERME_OWNER_ID
        sync: false
      - key: SUPERME_INITIAL_STARS
        value: "500000000"
