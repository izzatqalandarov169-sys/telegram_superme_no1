name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Superme overlay
        uses: actions/checkout@v4

      - name: Save required Superme overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/superme-overlay
          files=(
            TMessagesProj/src/main/java/org/telegram/messenger/SupermeBalance.java
            TMessagesProj/src/main/java/org/telegram/ui/CustomGiftApi.java
            TMessagesProj/src/main/java/org/telegram/ui/CustomGiftCreatorActivity.java
            TMessagesProj/src/main/java/org/telegram/ui/CustomGiftStoreActivity.java
            TMessagesProj/src/main/java/org/telegram/ui/SupermeCommerceConfig.java
            TMessagesProj/src/main/java/org/telegram/ui/SupermePurchaseApi.java
            TMessagesProj/src/main/java/org/telegram/ui/SupermePurchaseConfig.java
            TMessagesProj/src/main/java/org/telegram/ui/SupermeStarsActivity.java
            TMessagesProj/src/main/java/org/telegram/ui/SupermePremiumActivity.java
            TMessagesProj/src/main/java/org/telegram/ui/SupermeBusinessActivity.java
            TMessagesProj/src/main/java/org/telegram/ui/SupermeProfileGiftsView.java
          )
          for f in "${files[@]}"; do
            test -f "$f" || { echo "Missing Superme overlay: $f"; exit 1; }
            cp -a "$f" "/tmp/superme-overlay/$(basename "$f")"
          done

      - name: Checkout Telegram base
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          path: telegram-upstream
          fetch-depth: 1
          submodules: recursive

      - name: Apply Superme integration to Telegram source
        shell: bash
        run: |
          set -euo pipefail
          cp -a telegram-upstream/. ./
          rm -rf telegram-upstream
          mkdir -p TMessagesProj/src/main/java/org/telegram/ui
          mkdir -p TMessagesProj/src/main/java/org/telegram/messenger
          cp -a /tmp/superme-overlay/*.java TMessagesProj/src/main/java/org/telegram/ui/
          cp -a /tmp/superme-overlay/SupermeBalance.java TMessagesProj/src/main/java/org/telegram/messenger/
          rm -f TMessagesProj/src/main/java/org/telegram/ui/SupermeBalance.java

          python3 - <<'PY'
          from pathlib import Path

          p = Path('TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java')
          s = p.read_text(encoding='utf-8')
          field_marker = '    public ProfileGiftsView giftsView;\n'
          if 'private SupermeProfileGiftsView supermeProfileGiftsView;' not in s:
              if field_marker not in s:
                  raise SystemExit('Profile gifts field insertion point not found')
              s = s.replace(field_marker, field_marker + '    private SupermeProfileGiftsView supermeProfileGiftsView;\n', 1)
          setup_marker = '        sharedMediaLayout.setLayoutParams(new RecyclerView.LayoutParams(RecyclerView.LayoutParams.MATCH_PARENT, RecyclerView.LayoutParams.MATCH_PARENT));\n        sharedMediaLayout.initBlurCapture((ViewGroup) fragmentView);'
          setup_add = '''        sharedMediaLayout.setLayoutParams(new RecyclerView.LayoutParams(RecyclerView.LayoutParams.MATCH_PARENT, RecyclerView.LayoutParams.MATCH_PARENT));
        sharedMediaLayout.initBlurCapture((ViewGroup) fragmentView);
        supermeProfileGiftsView = new SupermeProfileGiftsView(context);
        FrameLayout.LayoutParams supermeGiftsLp = LayoutHelper.createFrame(LayoutHelper.MATCH_PARENT, LayoutHelper.MATCH_PARENT, Gravity.TOP | Gravity.LEFT);
        supermeGiftsLp.topMargin = dp(54);
        frameLayout.addView(supermeProfileGiftsView, supermeGiftsLp);
        boolean showSupermeGifts = sharedMediaLayout.getClosestTab() == SharedMediaLayout.TAB_GIFTS;
        supermeProfileGiftsView.setVisibility(showSupermeGifts ? View.VISIBLE : View.GONE);
        if (showSupermeGifts) supermeProfileGiftsView.rebuild();
'''
          if 'supermeProfileGiftsView = new SupermeProfileGiftsView(context);' not in s:
              if setup_marker not in s:
                  raise SystemExit('Profile gifts setup insertion point not found')
              s = s.replace(setup_marker, setup_add, 1)
          tab_marker = '''            protected void onSelectedTabChanged() {
                updateSelectedMediaTabText();
            }'''
          tab_add = '''            protected void onSelectedTabChanged() {
                updateSelectedMediaTabText();
                if (supermeProfileGiftsView != null) {
                    boolean show = getSelectedTab() == SharedMediaLayout.TAB_GIFTS;
                    supermeProfileGiftsView.setVisibility(show ? View.VISIBLE : View.GONE);
                    if (show) supermeProfileGiftsView.rebuild();
                }
            }'''
          if 'boolean show = getSelectedTab() == SharedMediaLayout.TAB_GIFTS;' not in s:
              if tab_marker not in s:
                  raise SystemExit('Profile tab callback insertion point not found')
              s = s.replace(tab_marker, tab_add, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('TMessagesProj/src/main/java/org/telegram/ui/Gifts/SendGiftSheet.java')
          s = p.read_text(encoding='utf-8')
          if 'import org.telegram.ui.SupermePurchaseApi;' not in s:
              marker = 'import org.telegram.ui.ProfileActivity;\n'
              if marker not in s:
                  raise SystemExit('SendGiftSheet import insertion point not found')
              s = s.replace(marker, marker + 'import org.telegram.ui.SupermePurchaseApi;\n', 1)
          old = 'StarsController.getInstance(currentAccount).buyStarGift('
          if old not in s:
              raise SystemExit('Telegram Star Gift purchase call not found')
          s = s.replace(old, 'SupermePurchaseApi.purchaseStarGift(currentAccount, ', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify Superme integration is actually in build source
        shell: bash
        run: |
          set -euo pipefail
          test -f TMessagesProj/src/main/java/org/telegram/ui/SupermePurchaseApi.java
          test -f TMessagesProj/src/main/java/org/telegram/ui/SupermeStarsActivity.java
          grep -q 'SupermePurchaseApi.purchaseStarGift' TMessagesProj/src/main/java/org/telegram/ui/Gifts/SendGiftSheet.java
          grep -q 'SupermeProfileGiftsView' TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java
          grep -q '500_000_000\|500000000' TMessagesProj/src/main/java/org/telegram/ui/Superme* TMessagesProj/src/main/java/org/telegram/messenger/SupermeBalance.java
          echo 'Superme integration verified in the exact source that will be compiled.'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace --no-daemon --max-workers=2

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          find TMessagesProj_App/build/outputs/apk -type f -name '*.apk' -print | grep -q '\.apk$'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-superme-debug-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
