name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Superme overlay
        uses: actions/checkout@v4

      - name: Save Superme overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/superme-overlay
          files=(
            TMessagesProj/src/main/java/org/telegram/messenger/SupermeBalance.java
            TMessagesProj/src/main/java/org/telegram/ui/CustomGiftApi.java
            TMessagesProj/src/main/java/org/telegram/ui/CustomGiftCreatorActivity.java
            TMessagesProj/src/main/java/org/telegram/ui/CustomGiftStoreActivity.java
            TMessagesProj/src/main/java/org/telegram/ui/SupermeCommerceConfig.java
            TMessagesProj/src/main/java/org/telegram/ui/SupermePurchaseApi.java
            TMessagesProj/src/main/java/org/telegram/ui/SupermePurchaseConfig.java
            TMessagesProj/src/main/java/org/telegram/ui/SupermeStarsActivity.java
            TMessagesProj/src/main/java/org/telegram/ui/SupermePremiumActivity.java
            TMessagesProj/src/main/java/org/telegram/ui/SupermeBusinessActivity.java
            TMessagesProj/src/main/java/org/telegram/ui/SupermeProfileGiftsView.java
            TMessagesProj/src/main/java/org/telegram/ui/BotCreatorActivity.java
          )
          for f in "${files[@]}"; do
            test -f "$f" || { echo "Missing Superme overlay file: $f"; exit 1; }
            cp -a "$f" "/tmp/superme-overlay/$(basename "$f")"
          done
          test -f .github/scripts/apply_superme.py
          cp -a .github/scripts/apply_superme.py /tmp/apply_superme.py

      - name: Checkout Telegram base
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          path: telegram-upstream
          fetch-depth: 1
          submodules: recursive

      - name: Apply Superme features to Telegram base
        shell: bash
        run: |
          set -euo pipefail
          cp -a telegram-upstream/. ./
          rm -rf telegram-upstream
          mkdir -p TMessagesProj/src/main/java/org/telegram/ui
          mkdir -p TMessagesProj/src/main/java/org/telegram/messenger
          for f in /tmp/superme-overlay/*.java; do
            base="$(basename "$f")"
            case "$base" in
              SupermeBalance.java) cp -a "$f" TMessagesProj/src/main/java/org/telegram/messenger/"$base" ;;
              *) cp -a "$f" TMessagesProj/src/main/java/org/telegram/ui/"$base" ;;
            esac
          done
          python3 /tmp/apply_superme.py
          grep -F 'SupermeProfileGiftsView' TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java >/dev/null
          grep -F 'SupermePurchaseApi' TMessagesProj/src/main/java/org/telegram/ui/Gifts/SendGiftSheet.java >/dev/null
          grep -F 'BotCreatorActivity' TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java >/dev/null
          test -f TMessagesProj/src/main/java/org/telegram/messenger/SupermeBalance.java
          test -f TMessagesProj/src/main/java/org/telegram/ui/BotCreatorActivity.java

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build AFAT debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace --no-daemon --max-workers=2

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail
          find TMessagesProj_App/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-superme-debug-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
