name: Superme Full Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Superme overlay
        uses: actions/checkout@v4

      - name: Save overlay
        run: |
          set -euo pipefail
          mkdir -p /tmp/superme-overlay
          for f in \
            TMessagesProj/src/main/java/org/telegram/ui/AdminPanelActivity.java \
            TMessagesProj/src/main/java/org/telegram/ui/CustomGiftApi.java \
            TMessagesProj/src/main/java/org/telegram/ui/CustomGiftCreatorActivity.java \
            TMessagesProj/src/main/java/org/telegram/ui/CustomGiftStoreActivity.java \
            TMessagesProj/src/main/java/org/telegram/ui/GiftCatalog.java \
            TMessagesProj/src/main/java/org/telegram/ui/BotCreatorActivity.java \
            TMessagesProj/src/main/java/org/telegram/ui/SupermeStarsActivity.java \
            TMessagesProj/src/main/java/org/telegram/ui/SupermePremiumActivity.java; do
            test -f "$f"
            cp -a "$f" /tmp/superme-overlay/
          done

      - name: Checkout Telegram base
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          path: telegram-upstream
          fetch-depth: 1
          submodules: recursive

      - name: Apply Superme features
        shell: bash
        run: |
          set -euo pipefail
          cp -a telegram-upstream/. ./
          rm -rf telegram-upstream
          mkdir -p TMessagesProj/src/main/java/org/telegram/ui
          cp -a /tmp/superme-overlay/. TMessagesProj/src/main/java/org/telegram/ui/

          python3 - <<'PY'
          from pathlib import Path
          ui = Path('TMessagesProj/src/main/java/org/telegram/ui')

          # Settings: add Superme screens while keeping the existing Telegram UI.
          p = ui / 'SettingsActivity.java'
          s = p.read_text(encoding='utf-8')
          marker = 'items.add(SettingCell.Factory.of(16, 0xFFF38B31, 0xFFE26314, R.drawable.settings_gift, getString(R.string.SendAGift)));'
          additions = '\n        items.add(SettingCell.Factory.of(24, 0xFF6C63FF, 0xFF4B44CC, R.drawable.settings_gift, "Hadya (Superme server)"));\n        items.add(SettingCell.Factory.of(25, 0xFF6C63FF, 0xFF4B44CC, R.drawable.settings_gift, "Admin panel"));\n        items.add(SettingCell.Factory.of(26, 0xFF6C63FF, 0xFF4B44CC, R.drawable.settings_gift, "🤖 Bot yaratish"));\n        items.add(SettingCell.Factory.of(27, 0xFFFFC107, 0xFFFF9800, R.drawable.settings_gift, "⭐ Stars (Superme server)"));'
          if 'Stars (Superme server)' not in s:
              if marker not in s:
                  raise SystemExit('Settings insertion point not found')
              s = s.replace(marker, marker + additions, 1)

          # Route the standard settings entries to the Superme local wallets/store.
          s = s.replace('            case 11:\n                presentSettingFragment(new PremiumPreviewFragment("settings"));\n                break;', '            case 11:\n                presentSettingFragment(new SupermePremiumActivity());\n                break;', 1)
          s = s.replace('            case 12:\n                presentSettingFragment(new StarsIntroActivity());\n                break;', '            case 12:\n                presentSettingFragment(new SupermeStarsActivity());\n                break;', 1)
          s = s.replace('            case 16:\n                UserSelectorBottomSheet.open(0, BirthdayController.getInstance(UserConfig.selectedAccount).getState());\n                break;', '            case 16:\n                presentSettingFragment(new CustomGiftStoreActivity());\n                break;', 1)

          marker = '            case 17:\n'
          if 'case 27:' not in s:
              if marker not in s:
                  raise SystemExit('Settings click insertion point not found')
              cases = '            case 27:\n                presentSettingFragment(new SupermeStarsActivity());\n                break;\n            case 26:\n                presentSettingFragment(new BotCreatorActivity());\n                break;\n            case 25:\n                presentSettingFragment(new AdminPanelActivity());\n                break;\n            case 24:\n                presentSettingFragment(new CustomGiftStoreActivity());\n                break;\n'
              s = s.replace(marker, cases + marker, 1)
          p.write_text(s, encoding='utf-8')

          # Admin panel defaults to the logged-in clone account.
          p = ui / 'AdminPanelActivity.java'
          s = p.read_text(encoding='utf-8')
          needle = 'target.setInputType(InputType.TYPE_CLASS_NUMBER);'
          inject = 'target.setText(String.valueOf(UserConfig.getInstance(UserConfig.selectedAccount).getClientUserId()));'
          if inject not in s:
              if needle not in s:
                  raise SystemExit('Admin target insertion point not found')
              s = s.replace(needle, needle + '\n        ' + inject, 1)
          p.write_text(s, encoding='utf-8')

          # Every user profile shows numeric ID when the upstream profile implementation exists.
          p = ui / 'ProfileActivity2.java'
          if p.exists():
              s = p.read_text(encoding='utf-8')
              needle = '    private static final int ID_NOTE = 11;'
              if 'ID_SUPERME_USER_ID' not in s and needle in s:
                  s = s.replace(needle, needle + '\n    private static final int ID_SUPERME_USER_ID = 12;\n    private static final int ID_SUPERME_GIFTS = 13;', 1)
              needle = '            addUsernameRow(items);\n            if (userInfo != null) {'
              if 'ID_SUPERME_USER_ID, String.valueOf(dialogId)' not in s and needle in s:
                  s = s.replace(needle, '            addUsernameRow(items);\n            items.add(TextDetailCell.Factory.of(ID_SUPERME_USER_ID, String.valueOf(dialogId), "User ID"));\n            if (userInfo != null) {', 1)
              needle = '        if (item.id == ID_BIZ_HOURS) {'
              if 'item.id == ID_SUPERME_USER_ID' not in s and needle in s:
                  s = s.replace(needle, '        if (item.id == ID_SUPERME_USER_ID) {\n            AndroidUtilities.addToClipboard(String.valueOf(dialogId));\n            BulletinFactory.of(ProfileActivity2.this).createCopyBulletin("User ID copied").show();\n        } else if (item.id == ID_BIZ_HOURS) {', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace --no-daemon --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: superme-full-debug-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
