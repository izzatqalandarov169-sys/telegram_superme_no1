name: Superme Full Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Superme overlay
        uses: actions/checkout@v4

      - name: Save Superme overlay
        run: |
          set -euo pipefail
          mkdir -p /tmp/superme-overlay
          for f in \
            TMessagesProj/src/main/java/org/telegram/ui/CustomGiftApi.java \
            TMessagesProj/src/main/java/org/telegram/ui/CustomGiftCreatorActivity.java \
            TMessagesProj/src/main/java/org/telegram/ui/CustomGiftStoreActivity.java \
            TMessagesProj/src/main/java/org/telegram/ui/GiftCatalog.java \
            TMessagesProj/src/main/java/org/telegram/ui/SupermeStarsActivity.java \
            TMessagesProj/src/main/java/org/telegram/ui/SupermePremiumActivity.java; do
            test -f "$f"
            cp -a "$f" /tmp/superme-overlay/
          done

      - name: Checkout Telegram base
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          path: telegram-upstream
          fetch-depth: 1
          submodules: recursive

      - name: Apply Superme features
        shell: bash
        run: |
          set -euo pipefail
          cp -a telegram-upstream/. ./
          rm -rf telegram-upstream
          mkdir -p TMessagesProj/src/main/java/org/telegram/ui
          cp -a /tmp/superme-overlay/. TMessagesProj/src/main/java/org/telegram/ui/

          python3 - <<'PY'
          from pathlib import Path
          p = Path('TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java')
          s = p.read_text(encoding='utf-8')
          marker = 'items.add(SettingCell.Factory.of(16, 0xFFF38B31, 0xFFE26314, R.drawable.settings_gift, getString(R.string.SendAGift)));'
          additions = '\n        items.add(SettingCell.Factory.of(24, 0xFF6C63FF, 0xFF4B44CC, R.drawable.settings_gift, "Hadya (Superme server)"));\n        items.add(SettingCell.Factory.of(25, 0xFF6C63FF, 0xFF4B44CC, R.drawable.settings_gift, "🎨 Gift yaratish"));\n        items.add(SettingCell.Factory.of(27, 0xFFFFC107, 0xFFFF9800, R.drawable.settings_gift, "⭐ Stars (Superme server)"));'
          if 'Hadya (Superme server)' not in s:
              if marker not in s:
                  raise SystemExit('Settings insertion point not found')
              s = s.replace(marker, marker + additions, 1)
          s = s.replace('            case 11:\n                presentSettingFragment(new PremiumPreviewFragment("settings"));\n                break;', '            case 11:\n                presentSettingFragment(new SupermePremiumActivity());\n                break;', 1)
          s = s.replace('            case 12:\n                presentSettingFragment(new StarsIntroActivity());\n                break;', '            case 12:\n                presentSettingFragment(new SupermeStarsActivity());\n                break;', 1)
          s = s.replace('            case 16:\n                UserSelectorBottomSheet.open(0, BirthdayController.getInstance(UserConfig.selectedAccount).getState());\n                break;', '            case 16:\n                presentSettingFragment(new CustomGiftStoreActivity());\n                break;', 1)
          marker = '            case 17:\n'
          if 'presentSettingFragment(new CustomGiftCreatorActivity())' not in s:
              if marker not in s:
                  raise SystemExit('Settings click insertion point not found')
              cases = '            case 27:\n                presentSettingFragment(new SupermeStarsActivity());\n                break;\n            case 25:\n                presentSettingFragment(new CustomGiftCreatorActivity());\n                break;\n            case 24:\n                presentSettingFragment(new CustomGiftStoreActivity());\n                break;\n'
              s = s.replace(marker, cases + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace --no-daemon --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: superme-full-debug-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
