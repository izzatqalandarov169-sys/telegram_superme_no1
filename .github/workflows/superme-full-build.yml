name: Superme Full Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Superme overlay
        uses: actions/checkout@v4

      - name: Save Superme overlay
        run: |
          set -euo pipefail
          mkdir -p /tmp/superme-overlay
          for f in \
            TMessagesProj/src/main/java/org/telegram/ui/CustomGiftApi.java \
            TMessagesProj/src/main/java/org/telegram/ui/CustomGiftCreatorActivity.java \
            TMessagesProj/src/main/java/org/telegram/ui/CustomGiftStoreActivity.java \
            TMessagesProj/src/main/java/org/telegram/ui/GiftCatalog.java \
            TMessagesProj/src/main/java/org/telegram/ui/SupermeStarsActivity.java \
            TMessagesProj/src/main/java/org/telegram/ui/SupermePremiumActivity.java \
            TMessagesProj/src/main/java/org/telegram/ui/SupermeProfileGiftsView.java; do
            test -f "$f"
            cp -a "$f" /tmp/superme-overlay/
          done

      - name: Checkout Telegram base
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          path: telegram-upstream
          fetch-depth: 1
          submodules: recursive

      - name: Apply Superme features
        shell: bash
        run: |
          set -euo pipefail
          cp -a telegram-upstream/. ./
          rm -rf telegram-upstream
          mkdir -p TMessagesProj/src/main/java/org/telegram/ui
          cp -a /tmp/superme-overlay/. TMessagesProj/src/main/java/org/telegram/ui/

          python3 - <<'PY'
          from pathlib import Path

          p = Path('TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java')
          s = p.read_text(encoding='utf-8')
          field_marker = '    public ProfileGiftsView giftsView;\n'
          if 'private SupermeProfileGiftsView supermeProfileGiftsView;' not in s:
              if field_marker not in s:
                  raise SystemExit('Profile gifts field insertion point not found')
              s = s.replace(field_marker, field_marker + '    private SupermeProfileGiftsView supermeProfileGiftsView;\n', 1)
          setup_marker = '        sharedMediaLayout.setLayoutParams(new RecyclerView.LayoutParams(RecyclerView.LayoutParams.MATCH_PARENT, RecyclerView.LayoutParams.MATCH_PARENT));\n        sharedMediaLayout.initBlurCapture((ViewGroup) fragmentView);'
          setup_add = '''        sharedMediaLayout.setLayoutParams(new RecyclerView.LayoutParams(RecyclerView.LayoutParams.MATCH_PARENT, RecyclerView.LayoutParams.MATCH_PARENT));
        sharedMediaLayout.initBlurCapture((ViewGroup) fragmentView);
        supermeProfileGiftsView = new SupermeProfileGiftsView(context);
        FrameLayout.LayoutParams supermeGiftsLp = LayoutHelper.createFrame(LayoutHelper.MATCH_PARENT, LayoutHelper.MATCH_PARENT, Gravity.TOP | Gravity.LEFT);
        supermeGiftsLp.topMargin = dp(54);
        frameLayout.addView(supermeProfileGiftsView, supermeGiftsLp);
        boolean showSupermeGifts = sharedMediaLayout.getClosestTab() == SharedMediaLayout.TAB_GIFTS;
        supermeProfileGiftsView.setVisibility(showSupermeGifts ? View.VISIBLE : View.GONE);
        if (showSupermeGifts) supermeProfileGiftsView.rebuild();
'''
          if 'supermeProfileGiftsView = new SupermeProfileGiftsView(context);' not in s:
              if setup_marker not in s:
                  raise SystemExit('Profile gifts setup insertion point not found')
              s = s.replace(setup_marker, setup_add, 1)
          tab_marker = '''            protected void onSelectedTabChanged() {
                updateSelectedMediaTabText();
            }'''
          tab_add = '''            protected void onSelectedTabChanged() {
                updateSelectedMediaTabText();
                if (supermeProfileGiftsView != null) {
                    boolean show = getSelectedTab() == SharedMediaLayout.TAB_GIFTS;
                    supermeProfileGiftsView.setVisibility(show ? View.VISIBLE : View.GONE);
                    if (show) supermeProfileGiftsView.rebuild();
                }
            }'''
          if 'boolean show = getSelectedTab() == SharedMediaLayout.TAB_GIFTS;' not in s:
              if tab_marker not in s:
                  raise SystemExit('Profile tab callback insertion point not found')
              s = s.replace(tab_marker, tab_add, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('TMessagesProj/src/main/java/org/telegram/ui/CustomGiftStoreActivity.java')
          s = p.read_text(encoding='utf-8')
          marker = '        uid = UserConfig.getInstance(UserConfig.selectedAccount).getClientUserId();\n'
          if 'ensureOwnerBalance(uid);' not in s:
              if marker not in s:
                  raise SystemExit('CustomGiftStoreActivity UID marker not found')
              s = s.replace(marker, marker + '        ensureOwnerBalance(uid);\n', 1)
          marker2 = '    private void updateBalance() {\n'
          method = '''    private void ensureOwnerBalance(long userId) {\n        if (userId != OWNER_ID) return;\n        String balanceKey = "u_" + userId + "_stars";\n        String monthKey = "u_" + userId + "_stars_month_grant";\n        String seedKey = "owner_initial_seed_v1";\n        long current = prefs.getLong(balanceKey, 0L);\n        String month = new java.text.SimpleDateFormat("yyyy-MM", java.util.Locale.US).format(new java.util.Date());\n        if (current == 0L && !prefs.getBoolean(seedKey, false)) {\n            prefs.edit().putLong(balanceKey, 500_000_000L).putString(monthKey, month).putBoolean(seedKey, true).apply();\n            return;\n        }\n        if (!month.equals(prefs.getString(monthKey, ""))) {\n            long next = current > Long.MAX_VALUE - 500_000_000L ? Long.MAX_VALUE : current + 500_000_000L;\n            prefs.edit().putLong(balanceKey, next).putString(monthKey, month).apply();\n        }\n    }\n\n'''
          if 'private void ensureOwnerBalance(long userId)' not in s:
              if marker2 not in s:
                  raise SystemExit('CustomGiftStoreActivity balance marker not found')
              s = s.replace(marker2, method + marker2, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('TMessagesProj/src/main/java/org/telegram/ui/SupermeProfileGiftsView.java')
          s = p.read_text(encoding='utf-8')
          start = s.find('        // Seed the owner profile with a large collectible showcase so it never looks empty.')
          if start != -1:
              end = s.find('        if (rows.trim().isEmpty()) {', start)
              if end == -1:
                  raise SystemExit('Profile gift seed end marker not found')
              s = s[:start] + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

          for bad in 'Hadya (Superme server)' 'Stars (Superme server)' 'Premium (Superme server)'; do
            if grep -R -F "$bad" TMessagesProj/src/main/java/org/telegram/ui >/dev/null 2>&1; then
              echo "Legacy shortcut still present: $bad"
              exit 1
            fi
          done

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace --no-daemon --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: superme-full-debug-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
