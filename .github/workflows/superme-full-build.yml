name: Superme Full Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superme-full-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Superme overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Save exact Superme commit and source
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > /tmp/superme-commit.txt
          mkdir -p /tmp/superme-overlay
          cp -a TMessagesProj /tmp/superme-overlay/TMessagesProj
          test -f .github/scripts/apply_superme.py
          cp -a .github/scripts/apply_superme.py /tmp/apply_superme.py

      - name: Checkout Telegram base
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          path: telegram-upstream
          fetch-depth: 1
          submodules: recursive

      - name: Apply complete Superme source
        shell: bash
        run: |
          set -euo pipefail
          cp -a telegram-upstream/. ./
          rm -rf telegram-upstream
          mkdir -p TMessagesProj
          cp -a /tmp/superme-overlay/TMessagesProj/. TMessagesProj/
          python3 /tmp/apply_superme.py

          for bad in 'Hadya (Superme server)' 'Stars (Superme server)' 'Premium (Superme server)'; do
            if grep -R -F "$bad" TMessagesProj/src/main/java/org/telegram/ui >/dev/null 2>&1; then
              echo "Legacy shortcut still present: $bad"
              exit 1
            fi
          done

          test -f TMessagesProj/src/main/java/org/telegram/ui/SupermePurchaseApi.java
          test -f TMessagesProj/src/main/java/org/telegram/ui/SupermeProfileGiftsView.java
          test -f TMessagesProj/src/main/java/org/telegram/messenger/SupermeBalance.java
          grep -F 'SupermeProfileGiftsView' TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java >/dev/null
          grep -F 'SupermePurchaseApi' TMessagesProj/src/main/java/org/telegram/ui/Gifts/SendGiftSheet.java >/dev/null

      - name: Record exact Superme source commit
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat /tmp/superme-commit.txt)"
          printf '%s\n' "$expected" > SOURCE_COMMIT.txt
          test "$(cat SOURCE_COMMIT.txt)" = "$GITHUB_SHA"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace --no-daemon --max-workers=2

      - name: Verify APK and source marker
        shell: bash
        run: |
          set -euo pipefail
          echo "Superme source commit: $(cat SOURCE_COMMIT.txt)"
          test "$(cat SOURCE_COMMIT.txt)" = "$GITHUB_SHA"
          find TMessagesProj_App/build/outputs/apk -type f -name '*.apk' -print -quit | grep -q .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: superme-full-debug-apk
          path: |
            TMessagesProj_App/build/outputs/apk/**/*.apk
            SOURCE_COMMIT.txt
          if-no-files-found: error
