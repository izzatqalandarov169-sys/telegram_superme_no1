name: Superme APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Superme repository
        uses: actions/checkout@v4

      - name: Save Superme overlay files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/superme-overlay
          cp -a TMessagesProj/src/main/java/org/telegram/ui/CustomGiftApi.java /tmp/superme-overlay/
          cp -a TMessagesProj/src/main/java/org/telegram/ui/CustomGiftCreatorActivity.java /tmp/superme-overlay/
          cp -a TMessagesProj/src/main/java/org/telegram/ui/CustomGiftStoreActivity.java /tmp/superme-overlay/
          cp -a TMessagesProj/src/main/java/org/telegram/ui/GiftCatalog.java /tmp/superme-overlay/
          cp -a TMessagesProj/src/main/java/org/telegram/ui/SupermeStarsActivity.java /tmp/superme-overlay/
          cp -a TMessagesProj/src/main/java/org/telegram/ui/SupermePremiumActivity.java /tmp/superme-overlay/
          cp -a TMessagesProj/src/main/java/org/telegram/ui/SupermeProfileGiftsView.java /tmp/superme-overlay/

      - name: Checkout full Telegram Android source
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          path: telegram-upstream
          fetch-depth: 1
          submodules: recursive

      - name: Apply Telegram base and Superme overlay
        shell: bash
        run: |
          set -euo pipefail
          cp -a telegram-upstream/. ./
          rm -rf telegram-upstream
          mkdir -p TMessagesProj/src/main/java/org/telegram/ui
          cp -a /tmp/superme-overlay/. TMessagesProj/src/main/java/org/telegram/ui/

          python3 - <<'PY'
          from pathlib import Path
          import re

          # Production login only: remove the visible Test Backend checkbox,
          # remove the special test-country path, and force production DC.
          p = Path('TMessagesProj/src/main/java/org/telegram/ui/LoginActivity.java')
          s = p.read_text(encoding='utf-8')

          ui_pattern = re.compile(r'\n\s*//enable test backend start\s*\n\s*//if \(BuildVars\.DEBUG_PRIVATE_VERSION\) \{\s*\n\s*testBackendCheckBox = new CheckBoxCell\(context, 2\);.*?\n\s*//\}\s*\n\s*//enable test backend end\s*\n', re.S)
          s, ui_count = ui_pattern.subn('\n', s, count=1)
          if ui_count != 1:
              raise SystemExit(f'Test Backend UI block not found (count={ui_count})')

          country_pattern = re.compile(r'\n\s*//enable test backend start\s*\n\s*boolean isTestCountryCode = text\.equals\("999"\);.*?\n\s*//enable test backend end\s*\n', re.S)
          s, country_count = country_pattern.subn('\n', s, count=1)
          if country_count != 1:
              raise SystemExit(f'Test country block not found (count={country_count})')

          backend_pattern = re.compile(r'\n\s*//enable test backend start\s*\n\s*boolean isTestBakcend = .*?;\s*\n\s*//enable test backend end\s*\n\s*if \(isTestBakcend != testBackend\) \{\s*\n\s*getConnectionsManager\(\)\.switchBackend\(false\);\s*\n\s*isTestBakcend = testBackend;\s*\n\s*\}', re.S)
          production_backend = '''
        boolean isTestBakcend = false;
        if (getConnectionsManager().isTestBackend()) {
            getConnectionsManager().switchBackend(false);
        }'''
          s, backend_count = backend_pattern.subn(production_backend, s, count=1)
          if backend_count != 1:
              raise SystemExit(f'Test backend switch block not found (count={backend_count})')

          s = s.replace('    private boolean testBackend = false;\n', '')
          s = s.replace('        private CheckBoxCell testBackendCheckBox;\n', '')
          p.write_text(s, encoding='utf-8')

          # Do not seed fake profile gifts; only actual received/purchased gifts are shown.
          p = Path('TMessagesProj/src/main/java/org/telegram/ui/SupermeProfileGiftsView.java')
          s = p.read_text(encoding='utf-8')
          start = s.find('        // Seed the owner profile with a large collectible showcase so it never looks empty.')
          if start != -1:
              end = s.find('        if (rows.trim().isEmpty()) {', start)
              if end == -1:
                  raise SystemExit('Profile gift seed end marker not found')
              s = s[:start] + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

          for bad in 'Hadya (Superme server)' 'Bot yaratish' 'Stars (Superme server)' 'Premium (Superme server)'; do
            if grep -R -F "$bad" TMessagesProj/src/main/java/org/telegram/ui >/dev/null 2>&1; then
              echo "Legacy shortcut still present: $bad"
              exit 1
            fi
          done
          test -f ./gradlew
          test -d ./TMessagesProj

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Telegram-compatible debug APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          find TMessagesProj_App/build/outputs/apk -type f -name '*.apk' -print -quit | grep -q .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: superme-debug-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
