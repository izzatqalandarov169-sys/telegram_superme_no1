name: Superme APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout complete Superme source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Save complete Superme source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/superme-overlay
          cp -a TMessagesProj /tmp/superme-overlay/TMessagesProj
          test -f .github/scripts/apply_superme.py
          cp -a .github/scripts/apply_superme.py /tmp/apply_superme.py

      - name: Checkout Telegram base
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          path: telegram-upstream
          fetch-depth: 1
          submodules: recursive

      - name: Apply complete Superme source
        shell: bash
        run: |
          set -euo pipefail
          cp -a telegram-upstream/. ./
          rm -rf telegram-upstream
          cp -a /tmp/superme-overlay/TMessagesProj/. TMessagesProj/
          python3 /tmp/apply_superme.py
          test -f TMessagesProj/src/main/java/org/telegram/ui/SupermePurchaseApi.java
          test -f TMessagesProj/src/main/java/org/telegram/messenger/SupermeBalance.java
          grep -F 'SupermeProfileGiftsView' TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java >/dev/null
          grep -F 'SupermePurchaseApi' TMessagesProj/src/main/java/org/telegram/ui/Gifts/SendGiftSheet.java >/dev/null

      - name: Record exact source commit
        run: git rev-parse HEAD > SOURCE_COMMIT.txt

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace --no-daemon --max-workers=2

      - name: Verify APK and source marker
        shell: bash
        run: |
          set -euo pipefail
          cat SOURCE_COMMIT.txt
          find TMessagesProj_App/build/outputs/apk -type f -name '*.apk' -print -quit | grep -q .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: superme-debug-apk
          path: |
            TMessagesProj_App/build/outputs/apk/**/*.apk
            SOURCE_COMMIT.txt
          if-no-files-found: error
