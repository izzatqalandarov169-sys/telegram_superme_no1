name: Superme APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Build debug APK
        run: ./gradlew :TMessagesProj:assembleAfatDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: superme-debug-apk
          path: '**/build/outputs/apk/**/*.apk'
