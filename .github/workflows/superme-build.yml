name: Superme APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Superme repository
        uses: actions/checkout@v4

      - name: Save Superme overlay files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/superme-overlay
          cp -a TMessagesProj/src/main/java/org/telegram/ui/CustomGiftApi.java /tmp/superme-overlay/
          cp -a TMessagesProj/src/main/java/org/telegram/ui/CustomGiftCreatorActivity.java /tmp/superme-overlay/
          cp -a TMessagesProj/src/main/java/org/telegram/ui/CustomGiftStoreActivity.java /tmp/superme-overlay/
          cp -a TMessagesProj/src/main/java/org/telegram/ui/GiftCatalog.java /tmp/superme-overlay/
          cp -a TMessagesProj/src/main/java/org/telegram/ui/SupermeStarsActivity.java /tmp/superme-overlay/
          cp -a TMessagesProj/src/main/java/org/telegram/ui/SupermePremiumActivity.java /tmp/superme-overlay/
          cp -a TMessagesProj/src/main/java/org/telegram/ui/SupermeProfileGiftsView.java /tmp/superme-overlay/

      - name: Checkout full Telegram Android source
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          path: telegram-upstream
          fetch-depth: 1
          submodules: recursive

      - name: Apply Telegram base and Superme overlay
        shell: bash
        run: |
          set -euo pipefail
          cp -a telegram-upstream/. ./
          rm -rf telegram-upstream
          mkdir -p TMessagesProj/src/main/java/org/telegram/ui
          cp -a /tmp/superme-overlay/. TMessagesProj/src/main/java/org/telegram/ui/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java')
          s = p.read_text(encoding='utf-8')

          gift_marker = 'items.add(SettingCell.Factory.of(16, 0xFFF38B31, 0xFFE26314, R.drawable.settings_gift, getString(R.string.SendAGift)));'
          gift_add = gift_marker + '\n        items.add(SettingCell.Factory.of(24, 0xFFF38B31, 0xFFE26314, R.drawable.settings_gift, "Hadya (Superme server)"));'
          if 'Hadya (Superme server)' not in s:
              if gift_marker not in s:
                  raise SystemExit('Settings gift insertion point not found')
              s = s.replace(gift_marker, gift_add, 1)

          stars_anchor = 'items.add(SettingCell.Factory.of(24, 0xFFF38B31, 0xFFE26314, R.drawable.settings_gift, "Hadya (Superme server)"));'
          stars_add = stars_anchor + '\n        items.add(SettingCell.Factory.of(25, 0xFFF3C23C, 0xFFE0A800, R.drawable.settings_gift, "Stars (Superme server)"));\n        items.add(SettingCell.Factory.of(26, 0xFFB96BFF, 0xFF7A3FB8, R.drawable.settings_gift, "Premium (Superme server)"));'
          if 'Stars (Superme server)' not in s:
              s = s.replace(stars_anchor, stars_add, 1)

          case_anchor = '            case 17:\n'
          case_add = ('            case 24:\n'
                       '                presentSettingFragment(new CustomGiftStoreActivity());\n'
                       '                break;\n'
                       '            case 25:\n'
                       '                presentSettingFragment(new SupermeStarsActivity());\n'
                       '                break;\n'
                       '            case 26:\n'
                       '                presentSettingFragment(new SupermePremiumActivity());\n'
                       '                break;\n' + case_anchor)
          if 'case 24:' not in s:
              if case_anchor not in s:
                  raise SystemExit('Settings click insertion point not found')
              s = s.replace(case_anchor, case_add, 1)

          # Fail the build if the three Superme entry points are not actually wired.
          for required in ('Hadya (Superme server)', 'Stars (Superme server)', 'Premium (Superme server)', 'case 24:', 'case 25:', 'case 26:'):
              if required not in s:
                  raise SystemExit('Superme settings wiring missing: ' + required)
          p.write_text(s, encoding='utf-8')
          PY
          test -f ./gradlew
          test -d ./TMessagesProj

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Telegram-compatible debug APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          find TMessagesProj_App/build/outputs/apk -type f -name '*.apk' -print -quit | grep -q .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: superme-debug-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
